name: Go CI

on: [push]


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Install SNMP
        run: sudo apt-get -y install snmp
      - name: Set GOARCH
        run: echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          go get -u github.com/gosnmp/gosnmp
          go get github.com/stretchr/testify/assert
          go get -u golang.org/x/tools/cmd/goimports
      - name: Build project
        run: go build .
      - name: Run tests with coverage
        run: |
          go test -coverpkg=./... -v ./... -coverprofile=tCoverage1.txt -covermode=atomic
      - name: Combine coverage files
        run: cat tCoverage*.txt > coverage.txt
      - name: Build CLI
        run: go build github.com/mertcikla/GoSNMPServer/cmd/gosnmpserver
